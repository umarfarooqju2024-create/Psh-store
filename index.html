<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSH Store</title>
  <style>
    :root { --primary:#6c3df5; --dark:#171526; --muted:#6e6a7d; --bg:#f7f7fb; --card:#fff; --danger:#d93025; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, sans-serif; color:var(--dark); background:var(--bg); }
    button, input, select, textarea { font:inherit; }
    button { cursor:pointer; border:0; }
    .topbar { background:var(--dark); color:#fff; padding:14px 5%; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .brand { font-size:22px; font-weight:700; }
    .topbar button { background:transparent; color:#fff; padding:8px 10px; }
    .hero { padding:42px 5%; background:linear-gradient(135deg,#6c3df5,#a85cf5); color:white; }
    .hero h1 { margin:0 0 10px; font-size:clamp(30px,5vw,54px); }
    .hero p { margin:0; font-size:18px; opacity:.92; }
    .wrap { max-width:1150px; margin:auto; padding:24px 5%; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
    .toolbar input, .toolbar select, .form input, .form textarea { border:1px solid #ddd9e8; border-radius:10px; padding:12px; background:#fff; }
    .toolbar input { flex:1; min-width:210px; }
    .btn { padding:11px 16px; border-radius:10px; background:var(--primary); color:#fff; font-weight:700; }
    .btn.secondary { background:#ece9f8; color:var(--dark); }
    .btn.danger { background:var(--danger); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px; }
    .card { background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 5px 20px #28204d12; }
    .product-image { height:175px; display:grid; place-items:center; font-size:64px; background:#eeeaff; }
    .card-body { padding:16px; }
    .card h3 { margin:0 0 8px; }
    .muted { color:var(--muted); }
    .price { font-size:20px; font-weight:700; margin:12px 0; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .panel { background:#fff; border-radius:16px; padding:20px; box-shadow:0 5px 20px #28204d12; margin-bottom:20px; }
    .panel h2 { margin-top:0; }
    .form { display:grid; gap:12px; }
    .form textarea { min-height:80px; resize:vertical; }
    .cart-row { display:flex; gap:12px; align-items:center; justify-content:space-between; border-bottom:1px solid #eee; padding:12px 0; }
    .cart-row:last-child { border-bottom:0; }
    .qty { display:flex; align-items:center; gap:8px; }
    .qty button { width:30px; height:30px; border-radius:50%; background:#eeeaff; color:var(--primary); font-weight:bold; }
    .empty { text-align:center; padding:45px 10px; color:var(--muted); }
    .notice { padding:12px 15px; border-radius:10px; background:#fff5d6; color:#735400; margin-bottom:16px; }
    .hidden { display:none !important; }
    footer { text-align:center; padding:28px; color:var(--muted); }
    @media (max-width:600px) { .topbar { padding:12px 4%; } .cart-row { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">PSH Store</div>
    <nav>
      <button id="homeBtn">Home</button>
      <button id="cartBtn">Cart (<span id="cartCount">0</span>)</button>
      <button id="adminBtn">Admin</button>
    </nav>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>आपकी पसंद की चीज़ें</h1>
      <p>अच्छी quality के products, आसान shopping और तेज़ order.</p>
    </div>
  </section>

  <main class="wrap">
    <section id="homeView">
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Product खोजें..." />
        <select id="categorySelect"><option value="all">सभी categories</option></select>
      </div>
      <div id="productGrid" class="grid"></div>
    </section>

    <section id="cartView" class="hidden">
      <div class="panel">
        <h2>आपका Cart</h2>
        <div id="cartItems"></div>
        <div id="cartSummary"></div>
        <button id="checkoutBtn" class="btn">Checkout करें</button>
      </div>
    </section>

    <section id="adminView" class="hidden">
      <div id="adminLoginPanel" class="panel">
        <h2>Admin Login</h2>
        <p class="muted">Demo password: <b>admin123</b></p>
        <form id="loginForm" class="form">
          <input id="adminPassword" type="password" placeholder="Password" required />
          <button class="btn" type="submit">Login</button>
        </form>
      </div>
      <div id="adminPanel" class="hidden">
        <div class="panel">
          <h2>नया Product जोड़ें</h2>
          <form id="productForm" class="form">
            <input id="productName" placeholder="Product name" required />
            <input id="productPrice" type="number" min="0" step="0.01" placeholder="Price" required />
            <input id="productCategory" placeholder="Category" required />
            <input id="productEmoji" placeholder="Emoji, जैसे: 👟" maxlength="4" />
            <textarea id="productDescription" placeholder="Description"></textarea>
            <button class="btn" type="submit">Product Save करें</button>
          </form>
        </div>
        <div class="panel">
          <h2>Products Manage करें</h2>
          <div id="adminProducts"></div>
          <button id="logoutBtn" class="btn secondary">Logout</button>
        </div>
      </div>
    </section>
  </main>

  <footer>© 2026 PSH Store</footer>

  <script>
    'use strict';

    const STORAGE_KEY = 'psh_store_products_v1';
    const CART_KEY = 'psh_store_cart_v1';

    const defaultProducts = [
      { id: 1, name: 'Smart Watch', price: 1999, category: 'Electronics', emoji: '⌚', description: 'Stylish और उपयोगी smart watch.' },
      { id: 2, name: 'Running Shoes', price: 1499, category: 'Fashion', emoji: '👟', description: 'आरामदायक running shoes.' },
      { id: 3, name: 'Headphones', price: 899, category: 'Electronics', emoji: '🎧', description: 'Clear sound और deep bass.' },
      { id: 4, name: 'Backpack', price: 799, category: 'Bags', emoji: '🎒', description: 'मजबूत और हल्का backpack.' }
    ];

    function readJSON(key, fallback) {
      try {
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : fallback;
      } catch (error) {
        return fallback;
      }
    }

    let products = readJSON(STORAGE_KEY, defaultProducts);
    let cart = readJSON(CART_KEY, []);

    const $ = (id) => document.getElementById(id);
    const money = (amount) => '₹' + Number(amount).toLocaleString('en-IN');

    function saveProducts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    }

    function saveCart() {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function showView(viewName) {
      $('homeView').classList.toggle('hidden', viewName !== 'home');
      $('cartView').classList.toggle('hidden', viewName !== 'cart');
      $('adminView').classList.toggle('hidden', viewName !== 'admin');
      if (viewName === 'cart') renderCart();
      if (viewName === 'admin') renderAdmin();
    }

    function renderCategories() {
      const current = $('categorySelect').value;
      const categories = [...new Set(products.map((product) => product.category))].sort();
      $('categorySelect').innerHTML = '<option value="all">सभी categories</option>' + categories.map((category) => `<option value="${escapeHTML(category)}">${escapeHTML(category)}</option>`).join('');
      $('categorySelect').value = categories.includes(current) ? current : 'all';
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[character]));
    }

    function renderHome() {
      const query = $('searchInput').value.trim().toLowerCase();
      const category = $('categorySelect').value;
      const filtered = products.filter((product) => {
        const matchesText = `${product.name} ${product.description}`.toLowerCase().includes(query);
        const matchesCategory = category === 'all' || product.category === category;
        return matchesText && matchesCategory;
      });

      $('productGrid').innerHTML = filtered.length ? filtered.map((product) => `
        <article class="card">
          <div class="product-image">${escapeHTML(product.emoji || '🛍️')}</div>
          <div class="card-body">
            <div class="muted">${escapeHTML(product.category)}</div>
            <h3>${escapeHTML(product.name)}</h3>
            <p class="muted">${escapeHTML(product.description)}</p>
            <div class="price">${money(product.price)}</div>
            <button class="btn" data-add="${product.id}">Cart में डालें</button>
          </div>
        </article>
      `).join('') : '<div class="empty">कोई product नहीं मिला।</div>';

      document.querySelectorAll('[data-add]').forEach((button) => {
        button.addEventListener('click', () => addToCart(Number(button.dataset.add)));
      });
    }

    function addToCart(productId) {
      const item = cart.find((cartItem) => cartItem.id === productId);
      if (item) item.quantity += 1;
      else cart.push({ id: productId, quantity: 1 });
      saveCart();
      updateCartCount();
      alert('Product cart में डाल दिया गया।');
    }

    function updateCartCount() {
      $('cartCount').textContent = cart.reduce((total, item) => total + item.quantity, 0);
    }

    function renderCart() {
      const validCart = cart.filter((item) => products.some((product) => product.id === item.id));
      cart = validCart;
      saveCart();
      if (!cart.length) {
        $('cartItems').innerHTML = '<div class="empty">आपका cart खाली है।</div>';
        $('cartSummary').innerHTML = '';
        $('checkoutBtn').classList.add('hidden');
        return;
      }

      $('cartItems').innerHTML = cart.map((item) => {
        const product = products.find((entry) => entry.id === item.id);
        return `<div class="cart-row">
          <div><b>${escapeHTML(product.name)}</b><br><span class="muted">${money(product.price)} × ${item.quantity}</span></div>
          <div class="qty"><button data-minus="${product.id}">−</button><b>${item.quantity}</b><button data-plus="${product.id}">+</button><button class="btn danger" data-remove="${product.id}">हटाएँ</button></div>
        </div>`;
      }).join('');

      const total = cart.reduce((sum, item) => {
        const product = products.find((entry) => entry.id === item.id);
        return sum + product.price * item.quantity;
      }, 0);
      $('cartSummary').innerHTML = `<h3>Total: ${money(total)}</h3>`;
      $('checkoutBtn').classList.remove('hidden');

      document.querySelectorAll('[data-plus]').forEach((button) => button.addEventListener('click', () => changeQuantity(Number(button.dataset.plus), 1)));
      document.querySelectorAll('[data-minus]').forEach((button) => button.addEventListener('click', () => changeQuantity(Number(button.dataset.minus), -1)));
      document.querySelectorAll('[data-remove]').forEach((button) => button.addEventListener('click', () => removeFromCart(Number(button.dataset.remove))));
    }

    function changeQuantity(productId, amount) {
      const item = cart.find((cartItem) => cartItem.id === productId);
      if (!item) return;
      item.quantity += amount;
      if (item.quantity <= 0) cart = cart.filter((cartItem) => cartItem.id !== productId);
      saveCart();
      updateCartCount();
      renderCart();
    }

    function removeFromCart(productId) {
      cart = cart.filter((item) => item.id !== productId);
      saveCart();
      updateCartCount();
      renderCart();
    }

    function renderAdmin() {
      const loggedIn = sessionStorage.getItem('psh_admin_logged_in') === 'yes';
      $('adminLoginPanel').classList.toggle('hidden', loggedIn);
      $('adminPanel').classList.toggle('hidden', !loggedIn);
      if (!loggedIn) return;
      $('adminProducts').innerHTML = products.map((product) => `<div class="cart-row"><div><b>${escapeHTML(product.name)}</b><br>${money(product.price)} · ${escapeHTML(product.category)}</div><button class="btn danger" data-delete="${product.id}">Delete</button></div>`).join('');
      document.querySelectorAll('[data-delete]').forEach((button) => button.addEventListener('click', () => deleteProduct(Number(button.dataset.delete))));
    }

    function deleteProduct(productId) {
      products = products.filter((product) => product.id !== productId);
      saveProducts();
      renderCategories();
      renderHome();
      renderAdmin();
    }

    $('homeBtn').addEventListener('click', () => showView('home'));
    $('cartBtn').addEventListener('click', () => showView('cart'));
    $('adminBtn').addEventListener('click', () => showView('admin'));
    $('searchInput').addEventListener('input', renderHome);
    $('categorySelect').addEventListener('change', renderHome);

    $('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      if ($('adminPassword').value === 'admin123') {
        sessionStorage.setItem('psh_admin_logged_in', 'yes');
        $('adminPassword').value = '';
        renderAdmin();
      } else alert('गलत password। Demo password: admin123');
    });

    $('productForm').addEventListener('submit', (event) => {
      event.preventDefault();
      products.push({
        id: Date.now(),
        name: $('productName').value.trim(),
        price: Number($('productPrice').value),
        category: $('productCategory').value.trim(),
        emoji: $('productEmoji').value.trim() || '🛍️',
        description: $('productDescription').value.trim() || 'नया product.'
      });
      saveProducts();
      event.target.reset();
      renderCategories();
      renderHome();
      renderAdmin();
      alert('Product save हो गया।');
    });

    $('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('psh_admin_logged_in');
      renderAdmin();
    });

    $('checkoutBtn').addEventListener('click', () => {
      const name = prompt('अपना नाम लिखें:');
      if (!name) return;
      const phone = prompt('अपना मोबाइल नंबर लिखें:');
      if (!phone) return;
      alert(`धन्यवाद ${name}! आपका order दर्ज हो गया है। हम ${phone} पर संपर्क करेंगे।`);
      cart = [];
      saveCart();
      updateCartCount();
      renderCart();
    });

    renderCategories();
    renderHome();
    updateCartCount();
  </script>
</body>
</html>
